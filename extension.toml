id = "axiom"
name = "Axiom"
description = "Axiom language support: syntax highlighting, diagnostics, completion, hover, go-to-definition, rename and formatting for `.axm` model/query files via the axiom-lsp language server."
version = "0.1.0"
schema_version = 1
authors = ["ahmed mbarek"]
repository = "https://github.com/FlowUp-Official/axiom-zed"

[language_servers.axiom]
name = "Axiom"
languages = ["Axiom"]

# Dedicated tree-sitter grammar for `.axm` files. The grammar name MUST
# match the symbol exported by the generated parser: `tree_sitter_axm`.
# Zed compiles the grammar with `-Wl,--export=tree_sitter_<name>`.
[grammars.axm]
repository = "https://github.com/FlowUp-Official/tree-sitter-axm"
commit = "4ddba5d10878b47ea4d8ff0ee5a1c576459b4481"
